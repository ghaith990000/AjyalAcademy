         screen (this also gives the first paint sooner). React replaces everything inside #root. Colours are the

    <style>
      body {
        margin: 0;
        background: #f3f6fc;
      }
      .splash {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;

        height: 96px;
        border-radius: 22px;
        box-shadow: 0 8px 24px -8px rgb(24 96 200 / 0.4);
